<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #7dcaed;
                padding: 20px;
            }
            .login-form {
                max-width: 400px;
                margin: 50px auto;
                background-color: #f2f2f2;
                padding: 25px;
                border-radius: 8px;
            }
            h1 {
                text-align: center;
                color: #333;
            }
            label {
                display: block;
                margin-bottom: 5px;
                margin-top: 10px;
                color: #333;
            }
            input[type="email"], input[type="password"] {
                width: 100%;
                padding: 8px;
                margin: 5px 0 15px 0;
                box-sizing: border-box;
            }
            button {
                background-color: #4CAF50;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #8093bd;
            }
        </style>
    </head>
    <body>
        <div class="login-form">
            <h1>Student Login</h1>
            <form onsubmit="return false;" method="post" action="/login">
                <label for="student_id">Student ID:</label><br>
                <input type="text" id="student_id" name="student_id" placeholder="Enter your student ID" required><br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

                <button type="button" onclick="window.location.href='menu.html'">Login</button>
            </form>
            <p>Don't have an account? <a href="registration.html">Register here</a></p>
        </div>
    </body>
</html>
