<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Registration</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #92b1e1;
                padding: 20px;
            }
            .registration-form {
                max-width: 400px;
                margin: auto;
                background-color: #f2f2f2;
                padding: 25px;
                border-radius: 8px;
            }
            h1 {
                text-align: center;
                color: #333;
            }
            label {
                display: block;
                margin-bottom: 5px;
                margin-top: 10px;
                color: #333;
            }
            input[type="text"], input[type="email"], input[type="password"] {
                width: 100%;
                padding: 8px;
                margin: 5px 0 15px 0;
                box-sizing: border-box;
            }
            button {
                background-color: #4CAF50;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #5b83da;
            }
        </style>
    </head>
    <body>
        <div class="registration-form">
        <h1>Student Registration</h1>
        <form onsubmit="return false;" method="post" action="/registration.html">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

            <label for="confirm_password">Confirm Password:</label><br>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required><br><br>

            <label for="student_id">Student ID:</label><br>
            <input type="text" id="student_id" name="student_id" placeholder="Enter your student ID" required><br><br>
            
            <button type="submit" value="Register">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </body>
</html>
